{{ define "search_results.html" }}
<div id="search-results-wrapper">
  <div class="section-header">
    <h2>Search Results</h2>
    <span class="section-meta mono">{{ .TotalCount }} record(s) found</span>
  </div>

  {{ template "resource_table.html" .Results }}

  {{ if gt .TotalPages 1 }}
  <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 16px;">
    <div>
      {{ if .HasPrev }}
      <a href="/search?q={{ .Query }}&branch={{ .Branch }}&course={{ .Course }}&semester={{ .Semester }}&exam_type={{ .ExamType }}&year={{ .Year }}&page={{ sub .CurrentPage 1 }}" 
         hx-get="/search?q={{ .Query }}&branch={{ .Branch }}&course={{ .Course }}&semester={{ .Semester }}&exam_type={{ .ExamType }}&year={{ .Year }}&page={{ sub .CurrentPage 1 }}"
         hx-target="#search-results-wrapper"
         hx-swap="outerHTML"
         class="btn btn-sm">&larr; Previous</a>
      {{ end }}
    </div>

    <span class="mono" style="font-size: 0.85rem;">Page {{ .CurrentPage }} of {{ .TotalPages }}</span>

    <div>
      {{ if .HasNext }}
      <a href="/search?q={{ .Query }}&branch={{ .Branch }}&course={{ .Course }}&semester={{ .Semester }}&exam_type={{ .ExamType }}&year={{ .Year }}&page={{ add .CurrentPage 1 }}"
         hx-get="/search?q={{ .Query }}&branch={{ .Branch }}&course={{ .Course }}&semester={{ .Semester }}&exam_type={{ .ExamType }}&year={{ .Year }}&page={{ add .CurrentPage 1 }}"
         hx-target="#search-results-wrapper"
         hx-swap="outerHTML"
         class="btn btn-sm">Next &rarr;</a>
      {{ end }}
    </div>
  </div>
  {{ end }}
</div>
{{ end }}
